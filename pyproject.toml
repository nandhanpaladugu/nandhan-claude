[project]
name = "nandhan-claude"
version = "0.1.0"
description = ""
authors = [
    {name = "Nandhan", email = "pvsnandhan@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)",
    "openai (>=3.19.2,<4.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[tool.poetry]
packages = [{include = "nandhan_claude"}]

[tool.poetry.scripts]
nandhan-claude = "nandhan_claude.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
